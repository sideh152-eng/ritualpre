<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8d7e0">
<title>A Little World Made for Ritika</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Caveat:wght@500&display=swap">
<style>
:root{
  --bg1:#fde4ec;--bg2:#fff7ee;--bg3:#e4d9f5;
  --ink:#4a3350;--soft:#7d6585;--paper:#fffaf3;--gold:#c9a24b;--blush:#f4b6c8;--lav:#cdbdf0;--blue:#cfe3f4;
  --serif:"Cormorant Garamond",Georgia,"Iowan Old Style",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2f2040;--bg2:#3a2744;--bg3:#241a38;--ink:#fbeff5;--soft:#d3bfdc;--paper:#44304f}}
:root[data-theme="dark"]{--bg1:#2f2040;--bg2:#3a2744;--bg3:#241a38;--ink:#fbeff5;--soft:#d3bfdc;--paper:#44304f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(160deg,var(--bg1),var(--bg2) 50%,var(--bg3));color:var(--ink);font-family:var(--sans);overflow:hidden}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#bgfx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.st{position:absolute;color:var(--gold);opacity:.6;animation:fl linear infinite}
.st.p{width:10px;height:10px;border-radius:60% 0 60% 0;background:var(--blush);color:transparent}
@keyframes fl{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-110vh) rotate(160deg);opacity:0}}
.scene{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;display:flex;padding:calc(env(safe-area-inset-top,0px) + 56px) 20px calc(env(safe-area-inset-bottom,0px) + 32px);text-align:center;opacity:0;visibility:hidden;transform:scale(.98);transition:opacity .9s,visibility .9s,transform .9s;outline:none}
.scene.on{opacity:1;visibility:visible;transform:none}
.in{margin:auto;width:100%;max-width:640px}
h1,h2,.lead{font-family:var(--serif);font-weight:500;line-height:1.25;margin:0 0 18px}
.lead{font-size:clamp(22px,5.6vw,30px);font-style:italic}
h2{font-size:clamp(30px,8vw,48px)}
.hand{font-family:var(--hand);font-size:22px;color:var(--soft)}
.btn{font:600 16px var(--sans);color:#4a3350;background:linear-gradient(135deg,#fbd0dc,#d9ccf5);border:1px solid #fff9;border-radius:999px;min-height:48px;padding:12px 26px;margin-top:18px;cursor:pointer;touch-action:manipulation;box-shadow:0 8px 24px #c9a24b33,0 0 0 0 #c9a24b55;transition:transform .2s,box-shadow .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px #c9a24b55}
.btn:disabled{opacity:.6;cursor:default;transform:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.fade{opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity 1.2s,transform 1.2s,visibility 1.2s}
.fade.show{opacity:1;visibility:visible;transform:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:60;width:46px;height:46px;border-radius:50%;border:1px solid #fff8;background:#ffffffa8;font-size:20px;cursor:pointer}
/* scene 1 */
#cake{width:min(80vw,340px);height:auto;display:block;margin:6px auto 4px;overflow:visible}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite alternate}
.gl{transition:opacity .6s}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.9,1.1) rotate(4deg)}}
@keyframes blow{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.1,.8) rotate(28deg)}100%{transform:scale(.1,0) rotate(45deg);opacity:0}}
@keyframes smoke{0%{opacity:0;stroke-dashoffset:90}30%{opacity:.8}100%{opacity:0;stroke-dashoffset:0;transform:translateY(-22px)}}
.sm{opacity:0;stroke-dasharray:90;stroke-dashoffset:90}
.out .fl{animation:blow .7s ease-in forwards;animation-delay:var(--d)}
.out .gl{opacity:0}
.out .sm{animation:smoke 2.8s ease-out forwards;animation-delay:calc(var(--d) + .5s)}
/* scene 2 */
#w1{font-family:var(--serif);font-size:clamp(34px,9vw,58px);color:var(--ink);text-shadow:0 0 28px #c9a24b66;min-height:1.3em;margin:0 0 20px}
#w2{font-family:var(--serif);font-style:italic;font-size:clamp(20px,5vw,28px);color:var(--soft);line-height:1.5;margin:0 auto;max-width:480px}
/* scene 3 */
.hero{width:min(78vw,300px);aspect-ratio:3/4;margin:0 auto 10px;border-radius:150px 150px 18px 18px;padding:8px;background:linear-gradient(160deg,var(--gold),#f5e3b3,var(--gold));box-shadow:0 18px 40px #4a335033}
.hero img{width:100%;height:100%;object-fit:cover;border-radius:144px 144px 12px 12px;display:block}
.strip{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:26px 6px 30px;-webkit-overflow-scrolling:touch}
.pol{flex:0 0 72%;scroll-snap-align:center;margin:0;background:#fffdf8;padding:12px 12px 8px;border-radius:4px;box-shadow:0 10px 26px #4a335040;transform:translateY(34px) rotate(var(--r)) scale(.95);opacity:0;transition:opacity .9s,transform .9s,box-shadow .3s;color:#4a3350}
.pol.in{opacity:1;transform:rotate(var(--r))}
.pol:hover,.pol:active,.pol:focus-within{transform:rotate(0) scale(1.05);box-shadow:0 18px 40px #4a335066;z-index:2}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee}
.pol figcaption{font-family:var(--hand);font-size:22px;padding:8px 2px 4px;line-height:1.1}
.swipe{font-family:var(--hand);font-size:20px;color:var(--soft)}
@media(min-width:700px){.strip{flex-wrap:wrap;justify-content:center;overflow:visible}.pol{flex:0 0 200px}.swipe{display:none}.in.wide{max-width:900px}}
/* scene 4 */
.gift{position:relative;width:240px;height:380px;margin:0 auto}
.gift>*{position:absolute}
.gshadow{left:20px;bottom:0;width:200px;height:22px;background:radial-gradient(#0003,#0000 70%)}
.box{left:20px;bottom:14px;width:200px;height:130px;background:linear-gradient(#f6cddb,#e8a7bd);border-radius:6px 6px 14px 14px;z-index:2;box-shadow:0 10px 30px #4a335033}
.rib{position:absolute;left:50%;top:0;bottom:0;width:34px;margin-left:-17px;background:linear-gradient(90deg,#e8cd85,#c9a24b,#e8cd85)}
.lid{left:10px;bottom:144px;width:220px;height:46px;background:linear-gradient(#f2b8cb,#e49db6);border-radius:8px;z-index:3;transform-origin:left bottom;transition:transform .9s cubic-bezier(.3,1.4,.5,1) .9s}
.open .lid{transform:translate(26px,-96px) rotate(16deg)}
.bow{left:50%;top:-30px;width:0;height:0;z-index:4;transform-origin:0 0}
.bow b{position:absolute;width:52px;height:34px;border:9px solid #d6b45e;border-radius:50%;top:-4px}
.bow b:nth-child(1){left:-58px;transform:rotate(-20deg)}.bow b:nth-child(2){left:6px;transform:rotate(20deg)}
.bow s{position:absolute;left:-12px;top:0;width:24px;height:24px;border-radius:50%;background:#c9a24b}
.open .bow{animation:untie 1s ease-in-out forwards}
@keyframes untie{40%{transform:scale(1.25) rotate(-8deg)}100%{transform:translateY(34px) scale(.3) rotate(35deg);opacity:0}}
.glow{left:30px;bottom:130px;width:180px;height:180px;border-radius:50%;background:radial-gradient(#ffe39a,#ffe39a00 70%);opacity:0;transition:opacity 1s 1.1s}
.open .glow{opacity:1}
.mc{left:50%;bottom:120px;width:56px;height:76px;margin-left:-28px;background:#fff7ee;border:2px solid #e2c378;border-radius:6px;z-index:1;opacity:0;transform:translateY(60px);display:grid;pl
